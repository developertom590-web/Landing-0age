<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu App | Gotta Download 'Em All!</title>
    <style>
        /* Pikachu Color Palette */
        :root {
            --pika-yellow: #FAD61D;
            --pika-red: #F62D14;
            --pika-black: #2B2B2B;
            --pika-white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--pika-yellow);
            color: var(--pika-black);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Landing Page Container */
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            border: 8px solid var(--pika-black);
            position: relative;
        }

        /* Pikachu Logo Styling */
        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            width: 150px;
            height: auto;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .logo:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* Text Styling */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--pika-black);
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #555;
            line-height: 1.5;
        }

        /* Download Button */
        .download-btn {
            background-color: var(--pika-red);
            color: var(--pika-white);
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(246, 45, 20, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            display: inline-block;
            text-decoration: none;
        }

        .download-btn:hover {
            background-color: #d82410;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(246, 45, 20, 0.6);
        }

        .download-btn:active {
            transform: translateY(1px);
        }

        /* Subtle Background Decoration (Electric Sparks) */
        .decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        /* Media Queries for Mobile */
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .logo { width: 120px; }
            .download-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Section -->
        <div class="logo-container">
            <!-- Using a high-quality Pikachu image URL -->
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pikachu Logo" class="logo">
        </div>

        <!-- Content Section -->
        <h1>Pikachu App</h1>
        <p>Your ultimate companion for electric-type adventures. Track, train, and power up your day!</p>

        <!-- Download Button -->
        <button class="download-btn" id="downloadBtn">⚡ Download Now</button>
    </div>

    <script>
        // Target Download Link
        const DOWNLOAD_LINK = "https://github.com/developertom590-web/Apk/releases/download/v1.0.0.0/Pikachu.apk";

        document.getElementById('downloadBtn').addEventListener('click', function() {
            // Optional: Visual feedback before redirect
            this.innerText = "Downloading...";
            this.style.opacity = "0.7";

            // Redirect to the example link after a tiny delay
            setTimeout(() => {
                window.location.href = DOWNLOAD_LINK;
            }, 500);
        });
    </script>

</body>
</html>
